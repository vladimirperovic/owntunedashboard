name: Format UX temp

on:
  push:
    branches: [ux-format-temp]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write ux-completion.js tests/ux-completion.spec.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ux-completion.js tests/ux-completion.spec.js
          git commit -m "Format UX completion files"
          git push
