name: Validate dashboard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # ESLint's no-undef is what catches a function reading a variable from a
      # sibling's scope; `node --check` only ever proved the file parsed.
      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ruff
        run: |
          pip install --quiet ruff==0.14.4
          ruff check scheduler/ deploy/update_server.py

      - name: Shellcheck deploy and updater scripts
        run: shellcheck deploy/deploy.sh deploy/update-dashboard.sh

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The companion service writes and deletes files in the music library and
      # starts playback in the house, so its logic gets unit tests.
      - name: Companion service unit tests
        run: python -m unittest discover -s scheduler -p 'test_*.py' -v

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile UI regression
        run: npx playwright test

      - name: Upload UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-artifacts
          path: |
            test-results/**/*.png
            test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7

  assets:
    name: Referenced assets exist
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # config.js is the single place assets are registered, so a rename that
      # misses one would 404 in the browser and nowhere else.
      - name: Every asset config.js loads is present
        shell: python
        run: |
          import re, sys
          from html.parser import HTMLParser
          from pathlib import Path

          HTMLParser().feed(Path('index.html').read_text(encoding='utf-8'))

          markup = Path('index.html').read_text(encoding='utf-8')
          config = Path('config.js').read_text(encoding='utf-8')

          # Strip comments first: they carry examples such as
          # 'station-logos/kexp.svg' that are documentation, not references.
          code = re.sub(r'/\*.*?\*/', '', config, flags=re.S)
          code = re.sub(r'^\s*//.*$', '', code, flags=re.M)

          listed = re.findall(r"^\s*'([\w./-]+\.(?:css|js))',", code, re.MULTILINE)
          logos = re.findall(r"'(station-logos/[^']+)'", code)
          icons = re.findall(r'(?:href|src)="([\w./-]+\.(?:svg|png))"', markup)
          referenced = sorted(set(listed + logos + icons))

          missing = [asset for asset in referenced if not Path(asset).is_file()]
          if missing:
              sys.exit(f'Missing assets referenced by config.js or index.html: {missing}')
          if not listed:
              sys.exit('No stylesheets or scripts found in config.js — has the loader changed shape?')
          print(f'{len(referenced)} referenced assets present ({len(listed)} loaded by config.js)')
