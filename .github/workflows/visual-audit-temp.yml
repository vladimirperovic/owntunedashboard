name: Visual audit temp

on:
  push:
    branches: [visual-audit-temp]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start preview server
        run: |
          node tests/static-server.js >/tmp/owntone-static.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/ >/tmp/owntone-index.html; then break; fi
            sleep 0.25
          done
          test -s /tmp/owntone-index.html
      - name: Browser load probe
        run: |
          google-chrome --version
          timeout 8s google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:4173/ >/tmp/dom.html
          test -s /tmp/dom.html
          grep -q 'OwnTone Dashboard' /tmp/dom.html
          echo 'PAGE_LOAD_OK'
