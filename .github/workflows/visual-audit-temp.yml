name: Visual audit temp

on:
  push:
    branches: [visual-audit-temp]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture desktop and mobile screenshots
        run: npx playwright test tests/visual-audit.spec.js
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: test-results/visual/*.png
          if-no-files-found: error
          retention-days: 1
