name: Visual audit temp

on:
  push:
    branches: [visual-audit-temp]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start preview server
        run: |
          node tests/static-server.js >/tmp/owntone-static.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/ >/tmp/owntone-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/owntone-index.html
      - name: Capture desktop and mobile screenshots
        run: |
          mkdir -p test-results/visual
          firefox --version
          timeout 25s firefox --headless --window-size 1440,900 \
            --screenshot test-results/visual/desktop-home.png http://127.0.0.1:4173/ || true
          timeout 25s firefox --headless --window-size 390,844 \
            --screenshot test-results/visual/mobile-home.png http://127.0.0.1:4173/ || true
          test -s test-results/visual/desktop-home.png
          test -s test-results/visual/mobile-home.png
          file test-results/visual/*.png
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: test-results/visual/*.png
          if-no-files-found: error
          retention-days: 1
