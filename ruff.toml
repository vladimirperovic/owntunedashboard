# Lint settings for the companion service.
# Run with: ruff check scheduler/

line-length = 118
target-version = "py311"

[lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # warnings
  "B",    # bugbear — mutable defaults, loop-variable capture, bare re-raises
  "S",    # bandit — the service writes files and fetches URLs
  "C4",   # comprehensions
  "SIM",  # simplifications
  "PIE",
  "RET",
  "RUF",
]
ignore = [
  # The service deliberately fetches http(s) stream URLs read from playlist
  # files; the scheme is validated by URL_RE before anything is written.
  "S310",
  # Random station picking is a shuffle, not a security decision.
  "S311",
]

[lint.per-file-ignores]
# Tests set environment defaults before importing the module under test.
"scheduler/test_*.py" = ["E402"]
