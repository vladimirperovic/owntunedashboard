# Example server block for the Plex / OwnTone LXC.
# Replace /opt/owntone-dashboard if you clone the repo elsewhere.
server {
    listen 3690;
    server_name _;

    root /opt/owntone-dashboard;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # OwnTone JSON API — same origin avoids browser CORS/mixed-content issues.
    location /api/ {
        proxy_pass http://127.0.0.1:3689/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OwnTone's MP3 stream is the local browser output.
    location = /stream.mp3 {
        proxy_pass http://127.0.0.1:3689/stream.mp3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # OwnTone push notifications — the browser subscribes to player/queue events.
    location = /owntone-events {
        proxy_pass http://127.0.0.1:3688/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Dashboard scheduler API. The service listens only on localhost:3691.
    location /scheduler/ {
        proxy_pass http://127.0.0.1:3691/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # One-click updater API. It is unprivileged and can only queue a request;
    # the root-owned systemd path/service performs the actual atomic swap.
    location /updater/ {
        proxy_pass http://127.0.0.1:3692/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # OwnTone artwork paths are returned as relative /artwork/... URLs.
    location /artwork/ {
        proxy_pass http://127.0.0.1:3689/artwork/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
