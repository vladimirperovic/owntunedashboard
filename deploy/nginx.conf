# Example server block for the Plex / OwnTone LXC.
# Replace /opt/owntunedashboard if you clone the repo elsewhere.
server {
    listen 3690;
    server_name _;

    root /opt/owntunedashboard;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # OwnTone JSON API — same origin avoids browser CORS/mixed-content issues.
    location /api/ {
        proxy_pass http://127.0.0.1:3689/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OwnTone artwork paths are returned as relative /artwork/... URLs.
    location /artwork/ {
        proxy_pass http://127.0.0.1:3689/artwork/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
